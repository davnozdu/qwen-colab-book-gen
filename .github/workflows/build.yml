name: build image

# Сборка и публикация образа в GitHub Container Registry. Никаких сборок на машине.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Конвейер берём из основного репозитория, чтобы не держать две копии.
      - name: Забрать конвейер сборки книги
        run: |
          git clone --depth 1 https://github.com/davnozdu/qwen-epub-audiobook.git vendor/qwen-epub-audiobook
          test -f vendor/qwen-epub-audiobook/colab/cli/run-book.py
          echo "коммит конвейера: $(git -C vendor/qwen-epub-audiobook rev-parse --short HEAD)"

      - uses: docker/setup-buildx-action@v3

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Проверяем то, что обещали: CLI на месте, tmux есть, конвейер скопирован, бот компилируется.
      - name: Проверить образ
        run: |
          docker run --rm --entrypoint sh "${{ env.IMAGE }}:${{ github.sha }}" -c '
            set -e
            colab version
            tmux -V
            python3 --version
            python3 -m py_compile /opt/bot/bot.py /opt/bot/jobs.py /opt/bot/tgapi.py /opt/bot/colab_auth.py
            test -f /opt/qwen-epub-audiobook/colab/cli/run-book.py
            test -f /opt/qwen-epub-audiobook/colab/colab_run_all.py
            echo "образ в порядке"
          '
