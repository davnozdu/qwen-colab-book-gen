name: build image

# Сборка и публикация образа в GitHub Container Registry. Никаких сборок на машине.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:
  # Ручной/автоматический пересбор из davnozdu/qwen-epub-audiobook
  # (там push -> workflow -> repository_dispatch сюда).
  repository_dispatch:
    types: [rebuild]

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Одна ветка: конвейер — из main конвейера, образ — :latest (его тянет рабочий контейнер).
  PIPELINE_REF: main
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Конвейер берём из основного репозитория, чтобы не держать две копии.
      - name: Забрать конвейер сборки книги
        run: |
          git clone --depth 1 --branch "$PIPELINE_REF" https://github.com/davnozdu/qwen-epub-audiobook.git vendor/qwen-epub-audiobook
          test -f vendor/qwen-epub-audiobook/colab/cli/run-book.py
          echo "ветка конвейера: $PIPELINE_REF, коммит: $(git -C vendor/qwen-epub-audiobook rev-parse --short HEAD)"

      - uses: docker/setup-buildx-action@v3

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Проверяем то, что обещали: CLI на месте, tmux есть, конвейер скопирован, бот компилируется.
      # Бот целиком: принимает книгу, запускает сборку в фоне (tmux) и присылает итог со ссылками.
      # Здесь же проверяется, что после задания не осталось ни окон tmux, ни процессов сборки.
      - name: Сквозная проверка контейнера
        run: IMAGE="${{ env.IMAGE }}:${{ github.sha }}" bash tests/smoke.sh

      - name: Проверить образ
        run: |
          docker run --rm --entrypoint sh "${{ env.IMAGE }}:${{ github.sha }}" -c '
            set -e
            colab version
            tmux -V
            # Обёртка должна понимать ключи, которыми её зовёт бот: иначе задание упадёт на старте.
            run-book --help | grep -q -- "--out-dir"
            run-book --help | grep -q -- "--stop-on-failure"
            python3 --version
            python3 -m py_compile /opt/bot/bot.py /opt/bot/jobs.py /opt/bot/tgapi.py /opt/bot/colab_auth.py
            # Финал в контейнере (режим частей): нужны ffmpeg и библиотеки нарезки/сборки/звука.
            ffmpeg -version >/dev/null
            ffprobe -version >/dev/null
            python3 -c "import ebooklib, lxml, soundfile, numpy, razdel"
            test -f /opt/qwen-epub-audiobook/shrink_book.py
            test -f /opt/qwen-epub-audiobook/colab/cli/run-book.py
            test -f /opt/qwen-epub-audiobook/colab/colab_run_all.py
            echo "образ в порядке"
          '
