# Единственный файл для запуска. Никаких переменных снаружи — все значения вписаны здесь.
#
# Запуск:            docker compose -f compose-token.yaml up -d
# Обновить образ:    docker compose -f compose-token.yaml pull && docker compose -f compose-token.yaml up -d
# Остановить:        docker compose -f compose-token.yaml down
#
# Менять нужно ровно одно поле: TELEGRAM_BOT_TOKEN. Остальное уже рабочее.
# Страница в браузере открывается по адресу http://<адрес-машины>:8090 — порт 8090 указан один раз
# и внутри контейнера, и снаружи, чтобы не было путаницы.
services:
  bot:
    image: ghcr.io/davnozdu/qwen-colab-book-gen:latest
    container_name: qwen-colab-book-gen
    restart: unless-stopped

    environment:
      # ─── впишите свой токен от @BotFather ───
      TELEGRAM_BOT_TOKEN: "123456789:AAвставьте_свой_токен"
      # Кому отвечать. Пусто — владельцем станет тот, кто первым напишет боту.
      TELEGRAM_CHAT_ID: ""

      # Ускоритель Colab: T4 (бесплатный), L4 или A100 — если есть Pro.
      GPU: "T4"
      # Папка внутри MyDrive, куда складывать готовые книги.
      DRIVE_DIR: "Audiobooks-colab"
      # Книги длиннее этого числа часов режутся на части (0 — не резать).
      SHRINK_HOURS: "7"
      # Сколько сборок одновременно: бот собирает по одной книге.
      MAX_JOBS: "1"

      # Веб-страница. Порт тот же, что и в ports: ниже — никаких двух разных чисел.
      WEB_PORT: "8090"
      WEB_ENABLED: "1"

    volumes:
      # Домашний каталог бота: вход в Colab (token.json) и настройки. Переживает обновление образа.
      - ./config:/home/bot
      # Книги, задания и готовые архивы.
      - ./data:/data

    # Страница в браузере: порт на вашей машине : тот же порт внутри контейнера.
    # Пароля пока нет, поэтому страница рассчитана только на локальную сеть.
    ports:
      - "8090:8090"

    # Псевдотерминал обязателен: Colab CLI спрашивает подтверждение Drive и код авторизации.
    tty: true
    # Книга может собираться несколько часов — даём контейнеру время закрыться аккуратно.
    stop_grace_period: 30s

    # Если хотите, чтобы файлы в томах принадлежали вам, а не root: посмотрите свои номера
    # командой `id -u` и `id -g` (на маке это обычно 501 и 20) и раскомментируйте строку.
    # user: "501:20"
