# Запуск: скопируйте .env.example в .env, впишите токен бота и выполните
#   docker compose up -d
# Обновление образа: docker compose pull && docker compose up -d
services:
  bot:
    image: ghcr.io/davnozdu/qwen-colab-book-gen:latest
    container_name: qwen-colab-book-gen
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GPU: ${GPU:-T4}
      DRIVE_DIR: ${DRIVE_DIR:-Audiobooks-colab}
      SHRINK_HOURS: ${SHRINK_HOURS:-7}
      MAX_JOBS: ${MAX_JOBS:-1}
    volumes:
      # Домашний каталог бота: там вход в Colab (token.json, sessions.json) и настройки.
      # Переживает пересборку и обновление образа.
      - ./config:/home/bot
      # Книги, задания и готовые архивы.
      - ./data:/data
    # Чтобы файлы в томах принадлежали вам, а не root, раскомментируйте и подставьте свои id:
    #   PUID=$(id -u) PGID=$(id -g) docker compose up -d
    # user: "${PUID:-0}:${PGID:-0}"
    # Псевдотерминал нужен Colab CLI: он спрашивает подтверждение Drive и код авторизации.
    tty: true
    # Если у вас уже есть свой бот-контейнер в одной сети — просто уберите эту строку.
    # networks: [default]
