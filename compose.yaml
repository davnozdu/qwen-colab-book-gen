# Запуск бота сборки аудиокниг. Меняете ТОЛЬКО две строки: токен и (если 8090 занят) номер порта.
#
#   docker compose up -d
#   обновить: docker compose pull && docker compose up -d --force-recreate
#   логи:     docker compose logs -f
#
# Порт: в паре "8090:8090" левое число — на вашей машине, правое — внутри контейнера.
# Правое (8090) менять не нужно: страница слушает его внутри. Если 8090 занят, поменяйте
# только левое, например "9090:8090", и открывайте http://<адрес-машины>:9090
services:
  bot:
    image: ghcr.io/davnozdu/qwen-colab-book-gen:latest
    container_name: qwen-colab-book-gen
    restart: unless-stopped

    environment:
      # Токен бота от @BotFather — обязательно.
      TELEGRAM_BOT_TOKEN: "123456789:AAвставьте_свой_токен"
      # Чей бот: только этому чату он служит. Пусто — владельцем станет тот, кто напишет первым.
      TELEGRAM_CHAT_ID: ""

    volumes:
      # Вход в Colab (token.json) и настройки — переживают обновление образа.
      - ./config:/home/bot
      # Книги, задания и готовые архивы.
      - ./data:/data

    ports:
      # меняйте только левое число, если 8090 занят
      - "8090:8090"

    # Обязательно: Colab CLI спрашивает подтверждение Drive и код авторизации.
    tty: true
